name: ci

# Two checks that need nothing but node + python: the desktop bundle must parse
# and must render every registered surface, and the Python half must compile.
# `pytest` needs a Hermes Agent checkout on PYTHONPATH (it imports hermes_cli and
# plugins.plugin_storage), so the README documents it instead of faking it here.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install react + jsdom for the harnesses
        run: npm install --no-save --no-package-lock react@19 react-dom@19 jsdom@25
      - name: Syntax-check the desktop bundle
        run: node --check desktop/plugin.js
      - name: Render every registered desktop surface
        run: node tools/render_smoke.mjs --modules node_modules
      - name: Pan, zoom and double-click behave
        run: node tools/viewport_test.mjs --modules node_modules

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the plugin's test dependencies
        run: python -m pip install --quiet pytest coverage
      - name: Compile the Python half
        run: |
          python -m compileall -q \
            __init__.py atlas_tools.py config.py credentials.py fusion.py hooks.py matcher.py \
            registry_kb.py schemas.py store.py uptime.py collectors dashboard
      - name: Every declared tool has a schema and matches catalog entry
        run: |
          python - <<'PY'
          import re, sys
          manifest = open("plugin.yaml").read()
          catalog = open("catalog/infra-atlas.yaml").read()
          tools = re.findall(r"^\s+-\s+(\w+)$", manifest.split("provides_tools:")[1].split("provides_hooks:")[0], re.M)
          cat_tools = re.findall(r"^\s+-\s+(\w+)$", catalog.split("provides_tools:")[1].split("provides_hooks:")[0], re.M)
          hooks = re.findall(r"^\s+-\s+(\w+)$", manifest.split("provides_hooks:")[1].split("config_schema:")[0], re.M)
          cat_hooks = re.findall(r"^\s+-\s+(\w+)$", catalog.split("provides_hooks:")[1].split("provides_middleware:")[0], re.M)
          schemas = open("schemas.py").read()
          missing = [t for t in tools if f'"{t}"' not in schemas]
          print("tools:", tools)
          if missing:
              sys.exit(f"missing schema: {missing}")
          if tools != cat_tools:
              sys.exit(f"catalog provides_tools {cat_tools} != plugin.yaml {tools}")
          if hooks != cat_hooks:
              sys.exit(f"catalog provides_hooks {cat_hooks} != plugin.yaml {hooks}")
          if not re.search(r'^sha:\s*"[0-9a-f]{40}"', catalog, re.M):
              sys.exit("catalog sha must be a 40-char hex SHA")
          PY
